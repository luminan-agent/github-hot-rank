<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub Hot Rank</title>
    <style>
      /* tokens（真源见 DESIGN.md） */
      :root {
        color-scheme: light dark;
        --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de;
        --fg: #1f2328; --muted: #59636e;
        --brand: #f0883e; --brand-ink: #bc4c00; --brand-soft: #fff1e5;
        --star: #e3b341; --star-ink: #9a6700; --star-soft: #fff8c5;
        --radius-ctl: 6px; --radius-card: 10px;
        --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117; --panel: #161b22; --border: #30363d;
          --fg: #e6edf3; --muted: #8b949e;
          --brand: #fd8c73; --brand-ink: #fd8c73; --brand-soft: #2e1608;
          --star: #e3b341; --star-ink: #e3b341; --star-soft: #2a2210;
        }
      }
      * { box-sizing: border-box; }
      body {
        font: 13px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        width: 400px; margin: 0; padding: var(--sp-3);
        background: var(--bg); color: var(--fg);
      }

      header {
        display: flex; gap: var(--sp-2); align-items: center;
        padding-bottom: var(--sp-3);
      }
      header svg { width: 22px; height: 22px; flex: none; }
      header b { font-size: 14px; letter-spacing: -0.2px; }
      header span { margin-left: auto; font-size: 11px; color: var(--muted); }

      nav {
        display: flex; gap: var(--sp-1);
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius-ctl); padding: 2px; margin-bottom: var(--sp-2);
      }
      nav button {
        flex: 1; font: inherit; font-weight: 600; font-size: 12px;
        border: none; background: none; border-radius: 5px;
        padding: 4px 0; cursor: pointer; color: var(--muted);
      }
      nav button.on { background: var(--brand-soft); color: var(--brand-ink); }

      .filters { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-2); }
      select, input {
        font: inherit; color: var(--fg);
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius-ctl); padding: 3px 8px;
      }
      input { flex: 1; min-width: 0; }
      input::placeholder { color: var(--muted); }

      ol {
        list-style: none; margin: 0; padding: 0;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius-card); overflow: hidden;
      }
      li {
        display: flex; gap: var(--sp-2); align-items: flex-start;
        padding: var(--sp-2) var(--sp-3);
      }
      li + li { border-top: 1px solid var(--border); }
      .body { flex: 1; min-width: 0; }
      .row1 { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }
      .rank {
        font: 700 15px/1 var(--mono); color: var(--brand-ink);
        min-width: 22px; text-align: right; flex: none;
      }
      .name {
        flex: 1; min-width: 0;
        font-weight: 600; color: var(--fg);
        text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .name:hover { color: var(--brand-ink); }
      .fav {
        flex: none; cursor: pointer; background: none; border: none;
        font-size: 14px; color: var(--muted); padding: 0 var(--sp-1);
      }
      .fav.on { color: var(--star); }
      .delta {
        flex: none; margin-left: auto;
        font: 600 12px/1 var(--mono);
        color: var(--brand-ink); background: var(--brand-soft);
        border-radius: 999px; padding: 3px 8px;
      }
      .meta { color: var(--muted); font-size: 12px; margin-top: 2px; padding-left: 30px; }
      .desc {
        color: var(--muted); font-size: 12px; margin-top: 2px;
        padding-left: calc(22px + var(--sp-2));
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .empty { color: var(--muted); text-align: center; padding: var(--sp-4) var(--sp-3); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 256 256" role="img" aria-label="GitHub Hot Rank" width="22" height="22">
        <title>GitHub Hot Rank · 焰尖金身（小尺寸）</title>
        <path fill="#e3b341" d="M128.0,84.0 L148.0,132.5 L200.3,136.5 L160.3,170.5 L172.7,221.5 L128.0,194.0 L83.3,221.5 L95.7,170.5 L55.7,136.5 L108.0,132.5 Z"/>
        <path fill="#f0883e" d="M 108.0,132.5 L 128.0,84.0 L 148.0,132.5 L 128.0,133.4 Z"/>
      </svg>
      <b>GitHub Hot Rank</b>
      <span>按涨幅排新星</span>
    </header>
    <nav>
      <button id="tab-hot" class="on">热榜</button>
      <button id="tab-fav">收藏</button>
    </nav>
    <div class="filters" id="filters">
      <select id="since">
        <option value="daily">今日</option>
        <option value="weekly">本周</option>
        <option value="monthly">本月</option>
      </select>
      <input id="lang" placeholder="语言（可空）" size="10" />
    </div>
    <ol id="list"></ol>
    <p id="status" class="empty">加载中…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
